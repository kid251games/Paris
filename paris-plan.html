<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطة باريس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --ink:#16233A; --mute:#5C6B80; --line:#DCE2EA;
  --metro:#1F5C4A; --metro-ink:#FFFFFF; --brass:#A87A2E; --brass-bg:#F6EBD6;
  --seine:#B9CDE0; --mapbg:#E6EBF1; --chip:#E9EDF3;
  --d1:#3B5BA5; --d8:#9B3D63; --d9:#23807A; --d7:#6B4FB3; --d6:#4E7A34; --d4:#B8434F; --da:#8A6D3B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --card:#162033; --ink:#E7ECF3; --mute:#9AA8BC; --line:#25324A;
    --metro:#3FA582; --metro-ink:#06140F; --brass:#E0B465; --brass-bg:#3A2F1A;
    --seine:#2B4767; --mapbg:#121C2E; --chip:#1E2A40;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --card:#162033; --ink:#E7ECF3; --mute:#9AA8BC; --line:#25324A;
  --metro:#3FA582; --metro-ink:#06140F; --brass:#E0B465; --brass-bg:#3A2F1A;
  --seine:#2B4767; --mapbg:#121C2E; --chip:#1E2A40;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
bdi{unicode-bidi:isolate}

/* hero */
.hero{padding:22px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero h1{margin:0;font-size:44px;font-weight:700;line-height:1;letter-spacing:-.5px}
.hero h1 span{display:block;font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:8px}
.progress{text-align:left;font-size:13px;color:var(--mute);white-space:nowrap}
.progress b{display:block;font-size:22px;color:var(--ink);font-weight:600}

/* map */
.mapcard{background:var(--mapbg);border-radius:20px;overflow:hidden;position:relative;border:1px solid var(--line)}
.mapcard svg{display:block;width:100%;height:auto}
.mapnote{position:absolute;bottom:8px;right:12px;font-size:11px;color:var(--mute)}
.dot{cursor:pointer;transition:opacity .2s}
.dot.dim{opacity:.15}
.dot.hit circle{stroke:var(--ink);stroke-width:2.5}
.lm{font-size:9px;fill:var(--mute);font-family:"Readex Pro",sans-serif}

/* location bar */
.locbar{margin:12px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.locdot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.locdot.on{background:var(--metro);box-shadow:0 0 0 4px color-mix(in srgb,var(--metro) 25%,transparent)}
.locmsg{flex:1;min-width:150px;font-size:13.5px}
.locmsg small{display:block;color:var(--mute);font-size:12px}
.btn{border:0;border-radius:999px;padding:8px 14px;background:var(--metro);color:var(--metro-ink);font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--chip);color:var(--ink)}
select{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 8px;max-width:100%}
.fallback{display:none;width:100%;gap:8px;align-items:center}
.fallback.show{display:flex}
.fallback select{flex:1}

/* sticky filters */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;margin:0 -16px;padding-inline:16px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row+.row{margin-top:6px}
.toggles{display:flex;gap:8px;margin-top:6px}

/* sections */
.sec{margin-top:26px}
.sec h2{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec h2 i{width:12px;height:12px;border-radius:3px}
.sec p.sub{margin:2px 0 12px;color:var(--mute);font-size:13px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px;margin-bottom:10px;scroll-margin-top:140px}
.card.flash{outline:2px solid var(--metro);outline-offset:2px}
.card.done{opacity:.6}
.tile{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;position:relative}
.tile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{position:absolute;bottom:-6px;left:-6px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:10.5px;border-radius:999px;min-width:22px;height:20px;display:grid;place-items:center;font-weight:600;padding:0 5px}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.name{font-weight:600;font-size:16px;line-height:1.3}
.badge{flex:none;font-size:11px;font-weight:600;background:var(--brass-bg);color:var(--brass);border-radius:6px;padding:2px 7px}
.desc{color:var(--mute);font-size:13.5px;margin:3px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.m{font-size:12.5px;background:var(--chip);border-radius:8px;padding:3px 8px;display:inline-flex;gap:5px;align-items:center}
.m.dist{background:color-mix(in srgb,var(--metro) 14%,transparent);color:var(--ink)}
.m svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:inline-flex;align-items:center;gap:5px;background:transparent;cursor:pointer}
.act.primary{background:var(--metro);color:var(--metro-ink);border-color:var(--metro)}
.act svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.check[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.extra{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px}
.extra dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.extra dt{color:var(--mute)}
.extra dd{margin:0}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.foot{margin-top:28px;color:var(--mute);font-size:12px;text-align:center}
:focus-visible{outline:2px solid var(--metro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>باريس<span id="summary">خطة الرحلة</span></h1>
    <div class="progress"><b id="doneCount">0</b>زرتها</div>
  </header>

  <div class="mapcard" id="mapcard"></div>

  <div class="locbar">
    <span class="locdot" id="locdot"></span>
    <div class="locmsg" id="locmsg">جارٍ تحديد موقعك…<small>المسافات والأوقات تقريبية</small></div>
    <button class="btn" id="locBtn" type="button">تحديث موقعي</button>
    <div class="fallback" id="fallback">
      <select id="origin" aria-label="نقطة الانطلاق"></select>
    </div>
  </div>

  <div class="filters">
    <div class="row" id="districtRow"></div>
    <div class="row" id="catRow"></div>
    <div class="toggles">
      <button class="chip" id="nearBtn" type="button" aria-pressed="false">الأقرب أولاً</button>
      <button class="chip" id="featBtn" type="button" aria-pressed="false">المميّز فقط</button>
      <button class="chip" id="hideDoneBtn" type="button" aria-pressed="false">إخفاء ما زرته</button>
    </div>
  </div>

  <main id="list"></main>
  <p class="foot">المسافة محسوبة بخط مستقيم مع معامل للطرق. لزمن الوصول الدقيق اضغط «الاتجاهات».</p>
</div>

const LANDMARKS=[
  {name:'برج إيفل',lat:48.8584,lng:2.2945},
  {name:'متحف اللوفر',lat:48.8606,lng:2.3376},

/* storage */
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const visited=new Set(load('paris-visited',[]));

const state={district:'all',cat:'all',near:false,feat:false,hideDone:false};
let origin=null; // {lat,lng,label,live}

/* geo math */
function hav(a,b){const R=6371,t=x=>x*Math.PI/180;const dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function est(p){
  if(!origin||p.lat==null)return null;
  const km=hav(origin,p)*1.3;
  const walk=km/4.8*60;
  const car=km<15?km/17*60+4:km/48*60+12;
  return{km,walk,car};
}
function fmtMin(m){m=Math.max(1,Math.round(m));if(m<60)return m+' د';const h=Math.floor(m/60),r=m%60;return h+' س'+(r?' '+r+' د':'')}
function fmtKm(k){return k<1?Math.round(k*1000/10)*10+' م':k.toFixed(k<10?1:0)+' كم'}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=encodeURIComponent;
function q(p){return p.name+', Paris'}
function mapsUrl(p){return 'https://www.google.com/maps/search/?api=1&query='+enc(q(p))+(p.pid?'&query_place_id='+p.pid:'')}
function dirUrl(p,e){const mode=e&&e.km<2.2?'walking':'transit';return 'https://www.google.com/maps/dir/?api=1&destination='+enc(q(p))+(p.pid?'&destination_place_id='+p.pid:'')+'&travelmode='+mode}
function picsUrl(p){return 'https://www.google.com/search?tbm=isch&q='+enc(p.name+' Paris')}

const SV=(d)=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+d+'</svg>';
const I_PIN=SV('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>');
const I_NAV=SV('<path d="M3 11l18-8-8 18-2-8z"/>');
const I_PIC=SV('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/>');
const I_OK=SV('<path d="M5 12l5 5 9-10"/>');
const I_WALK=SV('<circle cx="13" cy="4" r="1.8"/><path d="M10 21l2-6 3 3v3M9 10l3-3 3 3 3 1M12 7l-1 6"/>');
const I_CAR=SV('<path d="M4 16v-4l2-5h12l2 5v4z"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/>');

/* card */
function card(p){
  const e=est(p);
  const done=visited.has(p.i);
  let meta='';
  if(e){
    meta+='<span class="m dist">'+fmtKm(e.km)+'</span>';
    if(e.km<6) meta+='<span class="m">'+I_WALK+'مشي '+fmtMin(e.walk)+'</span>';
    meta+='<span class="m">'+I_CAR+'سيارة '+fmtMin(e.car)+'</span>';
  } else if(p.lat==null){
    meta+='<span class="m">الاستلام من وسط باريس</span>';
  }
  if(p.rating) meta+='<span class="m">★ '+p.rating.toFixed(1)+'</span>';
  meta+='<span class="m">'+CATS[p.c]+'</span>';

  let acts='';
  if(p.lat!=null){
    acts+='<a class="act primary" target="_blank" rel="noopener" href="'+dirUrl(p,e)+'">'+I_NAV+'الاتجاهات</a>';
    acts+='<a class="act" target="_blank" rel="noopener" href="'+mapsUrl(p)+'">'+I_PIN+'الموقع</a>';
  } else {
    acts+='<a class="act primary" target="_blank" rel="noopener" href="https://2cvparistour.com">'+I_NAV+'الحجز</a>';
  }
  acts+='<a class="act" target="_blank" rel="noopener" href="'+picsUrl(p)+'">'+I_PIC+'الصور</a>';
  acts+='<button class="act check" type="button" data-visit="'+p.i+'" aria-pressed="'+done+'">'+I_OK+(done?'زرته':'زرته؟')+'</button>';

  let extra='';
  if(p.name==='Classic 2CV Tour'){
    extra='<div class="extra"><dl>'+
      '<dt>الجولة</dt><dd>جولة ساعة مع مرشد، 15 معلماً، €90 للسيارة</dd>'+
      '<dt>السائق</dt><dd>اطلب <bdi>Marc</bdi>، ودود ومرن</dd>'+
      '<dt>السيارة</dt><dd>2CV مكشوفة، برتقالي أو أزرق كلاسيكي</dd>'+
      '<dt>التوقيت</dt><dd>احجز قرابة 1:30 ظهراً في يوم غير مزدحم، وتجنب الأحد والثلاثاء</dd>'+
      '<dt>الاستلام</dt><dd>من وسط باريس، الدوائر 1 إلى 8</dd></dl></div>';
  }
  return '<article class="card'+(done?' done':'')+'" id="p-'+p.i+'">'+
    '<div class="tile" style="background:'+DIST[p.d].c+'">'+SV(ICON[p.c])+'<b>'+p.no+'</b></div>'+
    '<div><div class="top"><div class="name"><bdi>'+esc(p.name)+'</bdi></div>'+(p.badge?'<span class="badge">'+esc(p.badge)+'</span>':'')+'</div>'+
    '<div class="desc">'+esc(p.desc)+'</div><div class="meta">'+meta+'</div><div class="acts">'+acts+'</div></div>'+extra+'</article>';
}

function visible(){
  return P.filter(p=>(state.district==='all'||p.d===state.district)&&(state.cat==='all'||p.c===state.cat)&&(!state.feat||p.badge)&&(!state.hideDone||!visited.has(p.i)));
}

function render(){
  const list=document.getElementById('list');
  const items=visible();
  let html='';
  if(!items.length){html='<p class="empty">لا توجد أماكن بهذه الفلاتر. جرّب «الكل».</p>'}
  else if(state.near&&origin){
    const sorted=items.slice().sort((a,b)=>{const ea=est(a),eb=est(b);return (ea?ea.km:1e9)-(eb?eb.km:1e9)});
    html='<section class="sec"><h2>الأقرب إليك</h2><p class="sub">من '+esc(origin.label)+'</p>'+sorted.map(card).join('')+'</section>';
  } else {
    Object.keys(DIST).forEach(k=>{
      const g=items.filter(p=>p.d===k); if(!g.length)return;
      html+='<section class="sec"><h2><i style="background:'+DIST[k].c+'"></i>'+DIST[k].n+'</h2><p class="sub">'+DIST[k].s+'</p>'+g.map(card).join('')+'</section>';
    });
  }
  list.innerHTML=html;
  document.getElementById('doneCount').textContent=visited.size+' / '+P.length;
  drawMap();
}

/* map */
const B={minLng:2.282,maxLng:2.378,minLat:48.840,maxLat:48.884};
const W=360, K=Math.cos(48.862*Math.PI/180), H=Math.round(W*(B.maxLat-B.minLat)/((B.maxLng-B.minLng)*K));
const X=lng=>(lng-B.minLng)/(B.maxLng-B.minLng)*W;
const Y=lat=>(B.maxLat-lat)/(B.maxLat-B.minLat)*H;
const SEINE=[[2.279,48.851],[2.2875,48.8555],[2.2935,48.8597],[2.3017,48.8637],[2.3135,48.8639],[2.3195,48.8635],[2.3295,48.8605],[2.3375,48.8583],[2.3415,48.8574],[2.3470,48.8553],[2.3530,48.8528],[2.3595,48.8503],[2.3665,48.8458],[2.3740,48.8410],[2.380,48.838]];
function drawMap(){
  const vis=new Set(visible().map(p=>p.i));
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="خريطة مبسطة لأماكن الخطة">';
  s+='<path d="M'+SEINE.map(([g,a])=>X(g).toFixed(1)+' '+Y(a).toFixed(1)).join(' L')+'" fill="none" stroke="var(--seine)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>';
  LANDMARKS.forEach(l=>{s+='<text class="lm" x="'+X(l.lng).toFixed(1)+'" y="'+(Y(l.lat)+12).toFixed(1)+'" text-anchor="middle">'+l.name+'</text><rect x="'+(X(l.lng)-2).toFixed(1)+'" y="'+(Y(l.lat)-2).toFixed(1)+'" width="4" height="4" fill="var(--mute)" transform="rotate(45 '+X(l.lng).toFixed(1)+' '+Y(l.lat).toFixed(1)+')"/>'});
  P.forEach(p=>{
    if(p.lat==null||p.lng>B.maxLng||p.lng<B.minLng)return;
    const cls='dot'+(vis.has(p.i)?'':' dim');
    s+='<g class="'+cls+'" data-i="'+p.i+'" tabindex="0" role="button" aria-label="'+esc(p.name)+'"><circle cx="'+X(p.lng).toFixed(1)+'" cy="'+Y(p.lat).toFixed(1)+'" r="5.2" fill="'+DIST[p.d].c+'" stroke="var(--mapbg)" stroke-width="1.5"/><circle cx="'+X(p.lng).toFixed(1)+'" cy="'+Y(p.lat).toFixed(1)+'" r="11" fill="transparent"/></g>';
  });
  if(origin&&origin.lng<B.maxLng&&origin.lng>B.minLng&&origin.lat<B.maxLat&&origin.lat>B.minLat){
    const ox=X(origin.lng).toFixed(1),oy=Y(origin.lat).toFixed(1);
    s+='<circle cx="'+ox+'" cy="'+oy+'" r="12" fill="var(--metro)" opacity=".18"/><circle cx="'+ox+'" cy="'+oy+'" r="6" fill="var(--metro)" stroke="#fff" stroke-width="2"/>';
  }
  s+='</svg><span class="mapnote">خريطة مبسطة، اضغط أي نقطة</span>';
  document.getElementById('mapcard').innerHTML=s;
}
function focusPlace(i){
  const p=P[i];
  if(!visible().some(v=>v.i===i)){state.district='all';state.cat='all';state.feat=false;state.hideDone=false;syncChips();render();}
  const el=document.getElementById('p-'+i); if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1600);
}
document.getElementById('mapcard').addEventListener('click',e=>{const g=e.target.closest('[data-i]');if(g)focusPlace(+g.dataset.i)});
document.getElementById('mapcard').addEventListener('keydown',e=>{if(e.key==='Enter'){const g=e.target.closest('[data-i]');if(g)focusPlace(+g.dataset.i)}});

/* chips */
function chip(label,val,pressed,dot){return '<button class="chip" type="button" data-v="'+val+'" aria-pressed="'+pressed+'">'+(dot?'<i style="background:'+dot+'"></i>':'')+label+'</button>'}
function syncChips(){
  document.getElementById('districtRow').innerHTML=chip('كل الأحياء','all',state.district==='all')+Object.keys(DIST).map(k=>chip(DIST[k].n,k,state.district===k,DIST[k].c)).join('');
  document.getElementById('catRow').innerHTML=chip('الكل','all',state.cat==='all')+Object.keys(CATS).map(k=>chip(CATS[k],k,state.cat===k)).join('');
  document.getElementById('nearBtn').setAttribute('aria-pressed',state.near);
  document.getElementById('featBtn').setAttribute('aria-pressed',state.feat);
  document.getElementById('hideDoneBtn').setAttribute('aria-pressed',state.hideDone);
}
document.getElementById('districtRow').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;state.district=b.dataset.v;syncChips();render()});
document.getElementById('catRow').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;state.cat=b.dataset.v;syncChips();render()});
document.getElementById('nearBtn').addEventListener('click',()=>{
  if(!origin){showFallback('حدد موقعك أو اختر نقطة انطلاق أولاً');return}
  state.near=!state.near;syncChips();render();window.scrollTo({top:document.getElementById('list').offsetTop-140,behavior:'smooth'})});
document.getElementById('featBtn').addEventListener('click',()=>{state.feat=!state.feat;syncChips();render()});
document.getElementById('hideDoneBtn').addEventListener('click',()=>{state.hideDone=!state.hideDone;syncChips();render()});
document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-visit]');if(!b)return;
  const i=+b.dataset.visit; visited.has(i)?visited.delete(i):visited.add(i);
  save('paris-visited',[...visited]); render();
});

/* location */
const locmsg=document.getElementById('locmsg'),locdot=document.getElementById('locdot'),fb=document.getElementById('fallback'),sel=document.getElementById('origin');
function setMsg(t,sub,on){locmsg.innerHTML=esc(t)+'<small>'+esc(sub||'')+'</small>';locdot.classList.toggle('on',!!on)}
function buildSelect(){
  let o='<option value="">اختر نقطة انطلاق…</option><optgroup label="معالم">'+LANDMARKS.map((l,i)=>'<option value="L'+i+'">'+l.name+'</option>').join('')+'</optgroup>';
  Object.keys(DIST).forEach(k=>{const g=P.filter(p=>p.d===k&&p.lat!=null);if(g.length)o+='<optgroup label="'+DIST[k].n+'">'+g.map(p=>'<option value="P'+p.i+'">'+esc(p.name)+'</option>').join('')+'</optgroup>'});
  sel.innerHTML=o;
}
function showFallback(t){fb.classList.add('show');setMsg(t||'الموقع التلقائي غير متاح هنا','اختر أقرب نقطة لك من القائمة، أو اضغط «الاتجاهات» لوقت دقيق من موقعك',false)}
sel.addEventListener('change',()=>{
  const v=sel.value;if(!v)return;
  const src=v[0]==='L'?LANDMARKS[+v.slice(1)]:P[+v.slice(1)];
  origin={lat:src.lat,lng:src.lng,label:src.name,live:false};
  save('paris-origin',origin);
  state.near=true;syncChips();
  setMsg('الانطلاق من: '+src.name,'المسافات والأوقات تقريبية',true);
  render();
});
let lastFix=null,watchId=null;
function onPos(pos){
  const o={lat:pos.coords.latitude,lng:pos.coords.longitude,label:'موقعك الحالي',live:true};
  const moved=!lastFix||hav(lastFix,o)>0.05;
  origin=o;lastFix=o;fb.classList.remove('show');
  const inParis=hav(o,{lat:48.8566,lng:2.3522})<40;
  setMsg(inParis?'تم تحديد موقعك':'تم تحديد موقعك (خارج باريس حالياً)','المسافات والأوقات تقريبية، و«الاتجاهات» تعطيك الدقيق',true);
  if(moved){if(!state.near){state.near=true;syncChips()}render()}
}
function onErr(err){
  const msg='الموقع التلقائي غير متاح هنا';
  const saved=load('paris-origin',null);
  if(saved&&!origin){origin=saved;state.near=true;syncChips();render();setMsg(msg,'نستخدم آخر نقطة اخترتها: '+saved.label,true);fb.classList.add('show');return}
  if(!origin||origin.live) showFallback(msg);
}
function locate(){
  if(!('geolocation' in navigator)){onErr();return}
  setMsg('جارٍ تحديد موقعك…','',false);
  navigator.geolocation.getCurrentPosition(p=>{onPos(p);if(watchId==null){try{watchId=navigator.geolocation.watchPosition(onPos,()=>{}, {enableHighAccuracy:true,maximumAge:30000})}catch(e){}}},onErr,{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
document.getElementById('locBtn').addEventListener('click',locate);

/* init */
document.getElementById('summary').textContent='خطة الرحلة، '+P.length+' مكاناً في '+(Object.keys(DIST).length-1)+' أحياء';
buildSelect();syncChips();render();locate();
})();
</script>
