<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KH Travels</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#124A52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500;1,600&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF2E6; --card:#FFFDF8; --ink:#123E45; --mute:#5F7579; --line:#EADBC6;
  --metro:#124A52; --metro-ink:#FAF2E6; --brass:#C2443F; --brass-bg:#FBE1DA;
  --seine:#B7D3D0; --mapbg:#F2E5D2; --chip:#F3E8D8; --shadow:0 8px 28px rgba(18,62,69,.18);
  --warn:#B23A3A; --warn-bg:#F8DCD8;
  --hero:#124A52; --hero-ink:#FAF2E6; --hero-mute:#B9D1CD; --coral:#E8685C;
  --d1:#124A52; --d2:#D44848; --d3:#2E8B83; --d4:#C98A3A; --d5:#6E8B4E; --d6:#8E4A6B; --d7:#9C6B45;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B2A2F; --card:#123A40; --ink:#FAF2E6; --mute:#A9C2BE; --line:#1F4D54;
    --metro:#E8685C; --metro-ink:#1A0E0C; --brass:#F2A196; --brass-bg:#4A2522;
    --seine:#1E5A60; --mapbg:#0F343A; --chip:#18454B; --shadow:0 8px 28px rgba(0,0,0,.5);
    --warn:#F59A90; --warn-bg:#4A2522;
    --hero:#0F3D44; --hero-ink:#FAF2E6; --hero-mute:#A9C2BE; --coral:#E8685C; --d1:#3E9C93;
  }
}
:root[data-theme="dark"]{
    --bg:#0B2A2F; --card:#123A40; --ink:#FAF2E6; --mute:#A9C2BE; --line:#1F4D54;
    --metro:#E8685C; --metro-ink:#1A0E0C; --brass:#F2A196; --brass-bg:#4A2522;
    --seine:#1E5A60; --mapbg:#0F343A; --chip:#18454B; --shadow:0 8px 28px rgba(0,0,0,.5);
    --warn:#F59A90; --warn-bg:#4A2522;
    --hero:#0F3D44; --hero-ink:#FAF2E6; --hero-mute:#A9C2BE; --coral:#E8685C; --d1:#3E9C93;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
bdi{unicode-bidi:isolate}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.brand{font-weight:700;font-size:14px;letter-spacing:.6px;color:var(--brass);direction:ltr}
.citysel{margin-inline-start:auto;position:relative}
.citysel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 34px 7px 14px;font-size:14px;font-weight:500;cursor:pointer}
.citysel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-left:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-70%) rotate(-45deg);pointer-events:none}
.addbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--metro);color:var(--metro-ink);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none}

.hero{padding:10px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero h1{margin:0;font-size:42px;font-weight:700;line-height:1;letter-spacing:-.5px}
.hero h1 span{display:block;font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:8px}
.progress{text-align:left;font-size:13px;color:var(--mute);white-space:nowrap}
.progress b{display:block;font-size:22px;color:var(--ink);font-weight:600}

/* map */
.mapcard{background:var(--mapbg);border-radius:20px;overflow:hidden;position:relative;border:1px solid var(--line)}
#mapwrap{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#mapwrap svg{display:block;width:100%;aspect-ratio:360/330;height:auto}
.mapnote{position:absolute;bottom:8px;right:12px;font-size:11px;color:var(--mute);pointer-events:none}
.dot.dim{opacity:.13}
.dot.sel .pt{stroke:var(--ink)}
.lbl{font-family:"Readex Pro",sans-serif;fill:var(--ink);font-weight:500;paint-order:stroke;stroke:var(--mapbg);stroke-linejoin:round;pointer-events:none}
.lm{font-family:"Readex Pro",sans-serif;fill:var(--mute);pointer-events:none}
.lmd{fill:var(--mute)}
.mapctl{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pop{position:absolute;left:8px;right:8px;bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);max-height:78%;overflow:auto}
.pop[hidden]{display:none}
.x{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--chip);font-size:18px;line-height:1;cursor:pointer}
.pop .ph{display:flex;gap:10px;align-items:flex-start;padding-left:36px}
.pop .pdot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.pop .psub{font-size:12.5px;color:var(--mute)}
.pop .desc{margin:4px 0 6px;font-size:13px}
.pop .meta{margin-bottom:8px}
.pop .act{padding:5px 8px;font-size:12.5px}
.pop .name{font-size:15px}

.locbar{margin:12px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.locdot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.locdot.on{background:var(--metro);box-shadow:0 0 0 4px color-mix(in srgb,var(--metro) 25%,transparent)}
.locmsg{flex:1;min-width:150px;font-size:13.5px}
.locmsg small{display:block;color:var(--mute);font-size:12px}
.btn{border:0;border-radius:999px;padding:8px 14px;background:var(--metro);color:var(--metro-ink);font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.45;cursor:default}
.fallback{display:none;width:100%}
.fallback.show{display:flex}
.fallback select,.field select{flex:1;width:100%;font-size:13.5px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px}

.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;margin:0 -16px}
.search{position:relative;margin-bottom:8px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 40px;font-size:15px;outline:none}
.search input:focus{border-color:var(--metro)}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;pointer-events:none}
.search .clr{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;font-size:16px;line-height:1;display:none}
.search.has .clr{display:block}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row+.row{margin-top:6px}

.sec{margin-top:26px}
.sec h2{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec h2 i{width:12px;height:12px;border-radius:3px}
.sec p.sub{margin:2px 0 12px;color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px;margin-bottom:10px}
.card.done{opacity:.6}
.tile{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;position:relative}
.tile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{position:absolute;bottom:-6px;left:-6px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:10.5px;border-radius:999px;min-width:22px;height:20px;display:grid;place-items:center;font-weight:600;padding:0 5px}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.name{font-weight:600;font-size:16px;line-height:1.3}
.badge{flex:none;font-size:11px;font-weight:600;background:var(--brass-bg);color:var(--brass);border-radius:6px;padding:2px 7px}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.mine{background:var(--chip);color:var(--ink)}
.desc{color:var(--mute);font-size:13.5px;margin:3px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.m{font-size:12.5px;background:var(--chip);border-radius:8px;padding:3px 8px;display:inline-flex;gap:5px;align-items:center}
.m.dist{background:color-mix(in srgb,var(--metro) 14%,transparent)}
.m .cnt{color:var(--mute)}
.m svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:inline-flex;align-items:center;gap:5px;background:transparent;cursor:pointer}
.act.primary{background:var(--metro);color:var(--metro-ink);border-color:var(--metro)}
.act.del{color:var(--warn)}
.act svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.check[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.extra{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px}
.extra dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.extra dt{color:var(--mute)}
.extra dd{margin:0}
mark{background:color-mix(in srgb,var(--brass) 30%,transparent);color:inherit;border-radius:3px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.foot{margin-top:28px;color:var(--mute);font-size:12px;text-align:center}

/* add sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,26,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);max-width:640px;margin:0 auto}
.scrim[hidden],.sheet[hidden]{display:none}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .x{top:14px;left:14px}
.sheet .hint{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.results{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.res{text-align:right;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer}
.res b{display:block;font-weight:600}
.res small{color:var(--mute);font-size:12px}
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;font-size:14px}
.status{color:var(--mute);font-size:13px;padding:8px 2px}
.sheet .btn{margin-top:16px;width:100%;justify-content:center;padding:11px}
:focus-visible{outline:2px solid var(--metro);outline-offset:2px}
.band{background:var(--hero);color:var(--hero-ink);margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 22px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;background:radial-gradient(circle,rgba(232,104,92,.25),transparent 70%);pointer-events:none}
.band .topbar{padding-top:6px}
.band .brand{color:var(--hero-ink);display:flex;align-items:center;gap:8px;font-family:"Lora",serif;font-style:italic;font-weight:600;font-size:18px;letter-spacing:.2px}
.band .brand img{width:32px;height:32px;border-radius:9px}
.band .brand em{font-style:normal;color:var(--coral)}
.band .citysel select{background:rgba(250,242,230,.12);border-color:rgba(250,242,230,.25);color:var(--hero-ink)}
.band .citysel select option{color:#123E45}
.band .citysel::after{border-color:var(--hero-ink)}
.band .addbtn{background:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(232,104,92,.45)}
.band .hero h1{font-family:"Lora",serif;font-style:italic;font-weight:600;font-size:46px}
.band .hero h1 #summary{color:var(--hero-mute);font-family:"Readex Pro",sans-serif;font-style:normal}
.band .progress{color:var(--hero-mute)}
.band .progress b{color:var(--hero-ink)}
.band + .mapcard{margin-top:16px}
.sec h2{font-family:"Lora","Readex Pro",serif}
.chip[aria-pressed="true"]{background:var(--metro);color:var(--metro-ink);border-color:var(--metro)}
.act.check[aria-pressed="true"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.badge{background:var(--brass-bg);color:var(--brass)}
.tile b{border-color:var(--line)}
mark{background:color-mix(in srgb,var(--coral) 28%,transparent)}
.search input:focus{border-color:var(--coral)}
.addbtn{background:var(--coral)}

</style>
</head>
<body>
<div class="wrap">
 <div class="band">
  <div class="topbar">
    <span class="brand"><img src="icon-192.png" alt="">KH <em>Travels</em></span>
    <label class="citysel"><select id="city" aria-label="المدينة"></select></label>
    <button class="addbtn" id="addBtn" type="button" aria-label="إضافة مكان">+</button>
  </div>
  <header class="hero">
    <h1><span id="cityName" style="display:inline;font-size:inherit;color:inherit;margin:0;font-weight:inherit"></span><span id="summary"></span></h1>
    <div class="progress"><b id="doneCount">0</b>زرتها</div>
  </header>
 </div>

  <div class="mapcard">
    <div id="mapwrap"></div>
    <div class="mapctl">
      <button type="button" data-z="in" aria-label="تكبير">+</button>
      <button type="button" data-z="out" aria-label="تصغير">−</button>
      <button type="button" data-z="reset" aria-label="عرض الكل">⤢</button>
    </div>
    <span class="mapnote" id="mapnote">قرّب بإصبعين لتظهر الأسماء</span>
    <div class="pop" id="pop" hidden></div>
  </div>

  <div class="locbar">
    <span class="locdot" id="locdot"></span>
    <div class="locmsg" id="locmsg">جارٍ تحديد موقعك…<small>المسافات والأوقات تقريبية</small></div>
    <button class="btn" id="locBtn" type="button">تحديث موقعي</button>
    <div class="fallback" id="fallback"><select id="origin" aria-label="نقطة الانطلاق"></select></div>
  </div>

  <div class="filters">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="ابحث باسم المكان…" autocomplete="off" enterkeyhint="search" aria-label="بحث">
      <button class="clr" id="clr" type="button" aria-label="مسح">×</button>
    </div>
    <div class="row" id="districtRow"></div>
    <div class="row" id="catRow"></div>
    <div class="row">
      <button class="chip" id="nearBtn" type="button" aria-pressed="false">الأقرب أولاً</button>
      <button class="chip" id="featBtn" type="button" aria-pressed="false">المميّز فقط</button>
      <button class="chip" id="doneBtn" type="button" aria-pressed="false">زرتها</button>
      <button class="chip" id="todoBtn" type="button" aria-pressed="false">ما زرتها</button>
    </div>
  </div>

  <main id="list"></main>
  <p class="foot">المسافة محسوبة بخط مستقيم مع معامل للطرق. لزمن الوصول الدقيق اضغط «الاتجاهات».</p>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <button class="x" id="sheetX" type="button" aria-label="إغلاق">×</button>
  <h3 id="sheetTitle">إضافة مكان</h3>
  <p class="hint" id="sheetHint">اكتب اسم المكان واختره من النتائج.</p>
  <div id="step1">
    <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="addQ" placeholder="مثلاً: Café de Flore" autocomplete="off" enterkeyhint="search"></div>
    <div class="status" id="addStatus"></div>
    <div class="results" id="addResults"></div>
  </div>
  <div id="step2" hidden>
    <div class="field"><label for="fName">الاسم</label><input id="fName"></div>
    <div class="field"><label>النوع</label><div class="row" id="fCat"></div></div>
    <div class="field"><label for="fDist">الحي</label><select id="fDist"></select></div>
    <div class="field"><label for="fDesc">ملاحظة (اختياري)</label><input id="fDesc" placeholder="وش يميزه؟"></div>
    <button class="btn" id="fSave" type="button">حفظ في القائمة</button>
    <button class="btn" id="fBack" type="button" style="background:var(--chip);color:var(--ink);margin-top:8px">رجوع للنتائج</button>
  </div>
</div>

function updateLocMsg(){

  else if(origin){setMsg('الانطلاق من: '+origin.label,'المسافات والأوقات تقريبية',true);fb.classList.add('show')}

function matches(p){if(!state.q)return true;return norm(state.q).split(' ').filter(Boolean).every(t=>p.nn.includes(t)||p.nd.includes(t))}
function hl(name){
  if(!state.q)return esc(name);
  const toks=norm(state.q).split(' ').filter(Boolean);
  const chars=[...name];let nstr='',idx=[];
  chars.forEach((ch,i)=>{const n=norm(ch)||(ch===' '?' ':'');for(const c of n){nstr+=c;idx.push(i)}});
  const mk=new Array(chars.length).fill(false);
  toks.forEach(t=>{let from=0,k;while((k=nstr.indexOf(t,from))>-1){for(let j=k;j<k+t.length;j++)mk[idx[j]]=true;from=k+t.length}});
  let out='',open=false;
  chars.forEach((ch,i)=>{if(mk[i]&&!open){out+='<mark>';open=true}if(!mk[i]&&open){out+='</mark>';open=false}out+=esc(ch)});
  return out+(open?'</mark>':'');
}

function visible(){
  return P.filter(p=>(state.district==='all'||p.d===state.district)&&(state.cat==='all'||p.c===state.cat)&&(!state.feat||(p.badge&&!p.mine))
    &&(state.visit==='all'||(state.visit==='done'?visited.has(p.vk):!visited.has(p.vk)))&&matches(p));

const kmOf=p=>{const e=est(p);return e?e.km:1e9};
function section(title,sub,items,color){return '<section class="sec"><h2>'+(color?'<i style="background:'+color+'"></i>':'')+title+'</h2><p class="sub">'+sub+'</p>'+items.map(card).join('')+'</section>'}
function render(){

    html=section('نتائج البحث',s.length+(s.length===1?' مكان':' أماكن'),s);
  } else if(state.near&&origin)html=section('الأقرب إليك','من '+esc(origin.label),items.slice().sort((a,b)=>kmOf(a)-kmOf(b)));

/* ---------- map ---------- */
const W=360,H=330,view={x:0,y:0,w:W},LABEL_Z=1.7;
let selected=null;
const wrapEl=document.getElementById('mapwrap'),pop=document.getElementById('pop'),note=document.getElementById('mapnote');
function proj(){const m=C.map,K=Math.cos(m.latc*Math.PI/180),span=(m.lng1-m.lng0)*K*H/W;return{X:lng=>(lng-m.lng0)/(m.lng1-m.lng0)*W,Y:lat=>(m.latc+span/2-lat)/span*H,inb:(lat,lng)=>lng>m.lng0&&lng<m.lng1&&Math.abs(lat-m.latc)<span/2}}
function clampView(){view.w=Math.min(W,Math.max(W/12,view.w));const h=view.w*H/W;view.x=Math.min(W-view.w,Math.max(0,view.x));view.y=Math.min(H-h,Math.max(0,view.y))}
function drawMap(){
  const {X,Y,inb}=proj(),vis=new Set(visible().map(p=>p.i));
  let s='<svg id="mapsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="خريطة أماكن '+C.name+'">';
  C.water.forEach(wt=>{s+='<path class="water" data-w="'+wt.w+'" d="M'+wt.pts.map(([g,a])=>X(g).toFixed(1)+' '+Y(a).toFixed(1)).join(' L')+'" fill="none" stroke="var(--seine)" stroke-linecap="round" stroke-linejoin="round"/>'});
  C.landmarks.forEach(l=>{const x=X(l.lng).toFixed(1),y=Y(l.lat).toFixed(1);s+='<circle class="lmd" cx="'+x+'" cy="'+y+'"/><text class="lm" x="'+x+'" data-y="'+y+'" text-anchor="middle">'+l.name+'</text>'});
  const pts=P.filter(p=>p.lat!=null&&inb(p.lat,p.lng)).sort((a,b)=>vis.has(a.i)-vis.has(b.i));
  pts.forEach(p=>{const x=X(p.lng).toFixed(1),y=Y(p.lat).toFixed(1);s+='<g class="dot'+(vis.has(p.i)?'':' dim')+(selected===p.i?' sel':'')+'" data-i="'+p.i+'"><circle class="hitc" cx="'+x+'" cy="'+y+'" fill="transparent"/><circle class="pt" cx="'+x+'" cy="'+y+'" fill="'+DIST[p.d].c+'" stroke="var(--mapbg)"/></g>'});
  pts.filter(p=>vis.has(p.i)).forEach(p=>{s+='<text class="lbl" data-i="'+p.i+'" x="'+X(p.lng).toFixed(1)+'" data-y="'+Y(p.lat).toFixed(1)+'" text-anchor="middle">'+esc(p.name)+'</text>'});
  if(origin&&inb(origin.lat,origin.lng)){const ox=X(origin.lng).toFixed(1),oy=Y(origin.lat).toFixed(1);s+='<circle class="me-h" cx="'+ox+'" cy="'+oy+'" fill="var(--metro)" opacity=".2"/><circle class="me" cx="'+ox+'" cy="'+oy+'" fill="var(--metro)" stroke="#fff"/>'}
  wrapEl.innerHTML=s+'</svg>';
  applyView();
  if(selected!=null){if(vis.has(selected))fillPop(selected);else closePop()}
}
function applyView(){
  const svg=document.getElementById('mapsvg');if(!svg)return;
  clampView();
  const h=view.w*H/W,z=W/view.w,u=1/z,showL=z>=LABEL_Z;
  svg.setAttribute('viewBox',view.x.toFixed(3)+' '+view.y.toFixed(3)+' '+view.w.toFixed(3)+' '+h.toFixed(3));
  svg.querySelectorAll('.water').forEach(p=>p.setAttribute('stroke-width',(+p.dataset.w*Math.pow(u,.6)).toFixed(3)));
  svg.querySelectorAll('.dot').forEach(g=>{const sel=g.classList.contains('sel'),pt=g.querySelector('.pt');pt.setAttribute('r',((sel?8:5.4)*u).toFixed(3));pt.setAttribute('stroke-width',((sel?2.5:1.5)*u).toFixed(3));g.querySelector('.hitc').setAttribute('r',(14*u).toFixed(3))});
  const placed=[],fs=10.5*u;
  [...svg.querySelectorAll('.lbl')].sort((a,b)=>(+(b.dataset.i==selected))-(+(a.dataset.i==selected))).forEach(t=>{
    t.setAttribute('font-size',fs.toFixed(3));t.setAttribute('stroke-width',(3*u).toFixed(3));
    const x=+t.getAttribute('x'),y=+t.dataset.y-9*u;t.setAttribute('y',y.toFixed(3));
    if(!showL){t.style.display='none';return}
    const w=t.textContent.length*fs*0.56,bx=[x-w/2-2*u,y-fs,x+w/2+2*u,y+fs*.3];
    const hit=placed.some(q=>!(bx[2]<q[0]||bx[0]>q[2]||bx[3]<q[1]||bx[1]>q[3]));
    t.style.display=hit?'none':'';if(!hit)placed.push(bx);
  });
  svg.querySelectorAll('.lm').forEach(t=>{t.style.display=showL?'none':'';t.setAttribute('font-size',(9*u).toFixed(3));t.setAttribute('y',(+t.dataset.y+11*u).toFixed(3))});
  svg.querySelectorAll('.lmd').forEach(c=>{c.setAttribute('r',(2.2*u).toFixed(3));c.style.display=showL?'none':''});
  const me=svg.querySelector('.me');if(me){me.setAttribute('r',(6*u).toFixed(3));me.setAttribute('stroke-width',(2*u).toFixed(3));svg.querySelector('.me-h').setAttribute('r',(13*u).toFixed(3))}
  note.style.display=(showL||selected!=null)?'none':'';
}
function zoomAt(px,py,f){
  const r=wrapEl.getBoundingClientRect(),upp=view.w/r.width;
  const wx=view.x+(px-r.left)*upp,wy=view.y+(py-r.top)*upp,nw=Math.min(W,Math.max(W/12,view.w/f));
  view.x=wx-(px-r.left)*nw/r.width;view.y=wy-(py-r.top)*nw/r.width;view.w=nw;applyView();
}
function fillPop(i){
  const p=P[i],e=est(p);
  pop.innerHTML='<button class="x" type="button" aria-label="إغلاق">×</button><div class="ph"><span class="pdot" style="background:'+DIST[p.d].c+'"></span><div><div class="name"><bdi>'+esc(p.name)+'</bdi> '+badgeHtml(p)+'</div><div class="psub">'+DIST[p.d].n+'، '+CATS[p.c]+'</div></div></div>'+
    (p.desc?'<div class="desc">'+esc(p.desc)+'</div>':'')+'<div class="meta">'+metaHtml(p,e)+'</div><div class="acts">'+actsHtml(p,e)+'</div>';
}
function openPop(i){
  selected=i;wrapEl.querySelectorAll('.dot.sel').forEach(g=>g.classList.remove('sel'));
  const g=wrapEl.querySelector('.dot[data-i="'+i+'"]');if(g){g.classList.add('sel');const l=g.parentNode.querySelector('.lbl');if(l)g.parentNode.insertBefore(g,l)}
  fillPop(i);pop.hidden=false;applyView();
}
function closePop(){selected=null;pop.hidden=true;wrapEl.querySelectorAll('.dot.sel').forEach(g=>g.classList.remove('sel'));applyView()}
pop.addEventListener('click',e=>{if(e.target.closest('.x')){closePop();return}const b=e.target.closest('[data-visit]');if(b)toggleVisit(+b.dataset.visit);const d=e.target.closest('[data-del]');if(d)delCustom(+d.dataset.del)});

const ptrs=new Map();let g0=null,moved=false,lastTap=0;
function snapshot(){const pts=[...ptrs.values()],r=wrapEl.getBoundingClientRect();if(pts.length===1)return{type:'pan',x:pts[0].x,y:pts[0].y,v:{...view},r};const[a,b]=pts;return{type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,v:{...view},r}}
wrapEl.addEventListener('pointerdown',e=>{wrapEl.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});if(ptrs.size===1)moved=false;if(ptrs.size>2)return;g0=snapshot()});
wrapEl.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p||!g0)return;p.x=e.clientX;p.y=e.clientY;
  if(Math.hypot(p.x-p.sx,p.y-p.sy)>6)moved=true;
  const r=g0.r,upp=g0.v.w/r.width;
  if(g0.type==='pan'&&ptrs.size===1){view.w=g0.v.w;view.x=g0.v.x-(p.x-g0.x)*upp;view.y=g0.v.y-(p.y-g0.y)*upp;applyView()}
  else if(g0.type==='pinch'&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const nw=Math.min(W,Math.max(W/12,g0.v.w*g0.d/Math.max(d,1)));const wx=g0.v.x+(g0.mx-r.left)*upp,wy=g0.v.y+(g0.my-r.top)*upp;view.w=nw;view.x=wx-(mx-r.left)*nw/r.width;view.y=wy-(my-r.top)*nw/r.width;applyView()}
});
function endPtr(e){
  const wasSingle=ptrs.size===1;ptrs.delete(e.pointerId);
  if(ptrs.size>0){g0=snapshot();moved=true;return}
  g0=null;if(e.type!=='pointerup'||!wasSingle||moved)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),hit=el&&el.closest&&el.closest('.dot:not(.dim)');
  if(hit){openPop(+hit.dataset.i);return}
  const now=Date.now();if(now-lastTap<320){zoomAt(e.clientX,e.clientY,2);lastTap=0;return}
  lastTap=now;if(selected!=null)closePop();
}
wrapEl.addEventListener('pointerup',endPtr);wrapEl.addEventListener('pointercancel',endPtr);
wrapEl.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.25:0.8)},{passive:false});
document.querySelector('.mapctl').addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;const r=wrapEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;if(b.dataset.z==='in')zoomAt(cx,cy,1.8);else if(b.dataset.z==='out')zoomAt(cx,cy,1/1.8);else{view.x=0;view.y=0;view.w=W;applyView()}});

function onPos(pos){

  if(!autoCityDone){autoCityDone=true;
    if(!load('kh-city-picked',false)){const near=Object.keys(CITIES).find(k=>hav(o,CITIES[k].center)<40);if(near&&near!==cityId){citySel.value=near;loadCity(near);return}}}
  if(hav(o,C.center)<150){origin=o;updateLocMsg();if(movedFar){if(!state.near){state.near=true;syncChips()}render()}}
  else if(!origin||origin.live){origin=o;updateLocMsg();if(movedFar)render()}
}
function onErr(){locFailed=true;if(!origin||origin.live){origin=load(C.originKey,null);if(origin){state.near=true;syncChips();render();setMsg('الموقع التلقائي غير متاح','نستخدم آخر نقطة اخترتها: '+origin.label,true);fb.classList.add('show')}else showFallback()}}
function locate(){
  if(!('geolocation' in navigator)){onErr();return}
  setMsg('جارٍ تحديد موقعك…','',false);
  navigator.geolocation.getCurrentPosition(p=>{onPos(p);if(watchId==null){try{watchId=navigator.geolocation.watchPosition(onPos,()=>{},{enableHighAccuracy:true,maximumAge:30000})}catch(e){}}},onErr,{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
document.getElementById('locBtn').addEventListener('click',locate);
citySel.addEventListener('change',()=>save('kh-city-picked',true));

/* ---------- add place ---------- */
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),addQ=document.getElementById('addQ'),addRes=document.getElementById('addResults'),addStatus=document.getElementById('addStatus'),step1=document.getElementById('step1'),step2=document.getElementById('step2');
let pick=null,pickCat='s',searchT=null,ctrl=null,results=[];
function openSheet(){document.getElementById('sheetTitle').textContent='إضافة مكان في '+C.name;document.getElementById('sheetHint').textContent='اكتب اسم المكان، وكل ما تزيد حرف تدق النتائج. اختر المكان الصحيح منها.';
  step1.hidden=false;step2.hidden=true;addQ.value='';addRes.innerHTML='';addStatus.textContent='';scrim.hidden=false;sheet.hidden=false;document.body.classList.add('lock');setTimeout(()=>addQ.focus(),50)}
function closeSheet(){scrim.hidden=true;sheet.hidden=true;document.body.classList.remove('lock');if(ctrl)ctrl.abort()}
document.getElementById('addBtn').addEventListener('click',openSheet);
document.getElementById('sheetX').addEventListener('click',closeSheet);scrim.addEventListener('click',closeSheet);
function guessCat(k,v){v=v||'';if(/cafe|coffee|bakery|pastry|confectionery|ice_cream|chocolate|tea/.test(v))return 'c';if(/restaurant|fast_food|bar|pub|food_court|biergarten/.test(v))return 'f';if(/hotel|hostel|guest_house|apartment/.test(v))return 'h';if(/museum|attraction|viewpoint|zoo|theme_park|gallery|theatre|cinema|artwork|park/.test(v)||k==='leisure')return 'a';return 's'}
function addrOf(pr){return [pr.street&&(pr.street+(pr.housenumber?' '+pr.housenumber:'')),pr.district||pr.locality,pr.city].filter(Boolean).join('، ')}
addQ.addEventListener('input',()=>{clearTimeout(searchT);const q=addQ.value.trim();if(q.length<2){addRes.innerHTML='';addStatus.textContent='';return}addStatus.textContent='جارٍ البحث…';searchT=setTimeout(()=>doSearch(q),350)});
async function doSearch(q){
  if(ctrl)ctrl.abort();ctrl=new AbortController();
  try{
    const u='https://photon.komoot.io/api/?limit=7&q='+enc(q)+'&lat='+C.center.lat+'&lon='+C.center.lng+'&location_bias_scale=0.6';
    const r=await fetch(u,{signal:ctrl.signal});const j=await r.json();
    results=(j.features||[]).filter(f=>f.properties&&f.properties.name).map(f=>({name:f.properties.name,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],addr:addrOf(f.properties),key:f.properties.osm_key,val:f.properties.osm_value}));
    results.sort((a,b)=>(hav(a,C.center)>60)-(hav(b,C.center)>60));
    addStatus.textContent=results.length?'':'ما لقيت نتائج. جرّب الاسم بالإنجليزي أو أضف اسم الشارع.';
    addRes.innerHTML=results.map((r,i)=>{const km=hav(r,C.center);return '<button class="res" type="button" data-r="'+i+'"><b><bdi>'+esc(r.name)+'</bdi></b><small><bdi>'+esc(r.addr||'')+'</bdi>'+(km>60?' · بعيد عن '+C.name+' ('+Math.round(km)+' كم)':'')+'</small></button>'}).join('');
  }catch(e){if(e.name!=='AbortError')addStatus.textContent='تعذّر البحث، تأكد من الإنترنت وحاول مرة ثانية.'}
}
addRes.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;pick=results[+b.dataset.r];
  pickCat=guessCat(pick.key,pick.val);
  document.getElementById('fName').value=pick.name;document.getElementById('fDesc').value='';
  document.getElementById('fCat').innerHTML=Object.keys(CATS).map(k=>chip(CATS[k],k,k===pickCat)).join('');
  // nearest district by centroid of existing places
  let best=null,bd=1e9;Object.keys(DIST).forEach(k=>{const g=P.filter(p=>p.d===k&&p.lat!=null&&!p.mine);if(!g.length)return;const c={lat:g.reduce((s,p)=>s+p.lat,0)/g.length,lng:g.reduce((s,p)=>s+p.lng,0)/g.length};const d=hav(c,pick);if(d<bd){bd=d;best=k}});
  document.getElementById('fDist').innerHTML=Object.keys(DIST).map(k=>'<option value="'+k+'"'+(k===best?' selected':'')+'>'+DIST[k].n+'</option>').join('');
  document.getElementById('sheetHint').textContent=pick.addr||'';
  step1.hidden=true;step2.hidden=false});
document.getElementById('fCat').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;pickCat=b.dataset.v;document.querySelectorAll('#fCat .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===pickCat))});
document.getElementById('fBack').addEventListener('click',()=>{step2.hidden=true;step1.hidden=false;document.getElementById('sheetHint').textContent='اختر المكان الصحيح من النتائج.'});
document.getElementById('fSave').addEventListener('click',()=>{
  if(!pick)return;const name=document.getElementById('fName').value.trim()||pick.name;
  const list=load('kh-custom-'+cityId,[]);const id=Date.now();
  list.push({id,name,desc:document.getElementById('fDesc').value.trim()||pick.addr||'',lat:pick.lat,lng:pick.lng,c:pickCat,d:document.getElementById('fDist').value});
  save('kh-custom-'+cityId,list);closeSheet();loadCity(cityId);
  const p=P.find(x=>x.cid===id);if(p){state.near=false;syncChips();render();const el=document.getElementById('p-'+p.i);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet()});

citySel.value=cityId;loadCity(cityId);locate();
})();
</script>
</body>
</html>
